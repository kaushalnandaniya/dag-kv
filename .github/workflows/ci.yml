name: DAG-KV Multi-Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install PyTorch
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Verify CLI Info & Device Discovery
        run: |
          python -m dag_kv.cli info

      - name: Run Test Suite (PyTorch Fallbacks & CPU Mocked)
        run: |
          pytest -v \
            tests/test_core_components.py \
            tests/test_rope_adjoint.py \
            tests/test_pytorch_fallback.py \
            tests/test_device_manager.py \
            tests/test_quantization.py \
            tests/test_dynamic_blocks.py \
            tests/test_hf_integration.py \
            tests/test_lru_eviction.py \
            tests/test_fused_int4.py \
            tests/test_model_generalization.py \
            tests/test_disk_persistence.py \
            tests/test_continuous_batching.py
