[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dag-kv"
version = "0.3.1"
description = "Universal Position-Decoupled Graph KV Cache with Query-Side Adjoint RoPE & LSE-Bounded Sparse Bridge Repair"
authors = [{ name = "Kaushal Nandaniya" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "numpy>=1.26.0",
    "safetensors>=0.4.0",
    "pyyaml>=5.3.0",
    "triton>=3.0.0; sys_platform == 'linux'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov"
]
vllm = [
    "vllm>=0.6.0"
]

[project.scripts]
dag-kv = "dag_kv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dag_kv*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
